<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PETPOINT | Necochea</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #111827;
            --accent: #f59e0b;
            --success: #25d366;
            --bg: #f9fafb;
            --card: #ffffff;
            --radius: 24px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--primary);
            padding-bottom: 120px;
        }

        /* Hero / Portada */
        .hero {
            height: 35vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%), 
                        url('https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 25px;
            color: white;
            border-radius: 0 0 35px 35px;
        }

        .hero h1 { margin: 0; font-size: 34px; font-weight: 800; }
        .hero p { margin: 5px 0 0; font-size: 14px; font-weight: 600; color: #fbbf24; }

        /* Buscador Moderno */
        .search-area { padding: 0 20px; margin-top: -25px; }
        .search-input {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 20px;
            padding: 0 20px;
            font-size: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            outline: none;
        }

        /* Filtros */
        .filters { display: flex; gap: 10px; overflow-x: auto; padding: 20px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .chip {
            padding: 10px 22px;
            background: white;
            border-radius: 50px;
            white-space: nowrap;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            cursor: pointer;
            border: 2px solid transparent;
        }
        .chip.active { background: var(--primary); color: white; }

        /* Productos */
        .grid { padding: 0 20px; display: grid; gap: 15px; }
        .card {
            background: white;
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9;
        }
        .card img { width: 85px; height: 85px; border-radius: 18px; object-fit: cover; }
        .card-info { flex: 1; }
        .card-brand { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        .card-name { font-size: 16px; font-weight: 700; margin: 2px 0; }
        .card-price { font-size: 18px; font-weight: 800; color: var(--primary); }

        /* Barra Inferior (Pedido) */
        .order-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: white;
            padding: 20px;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.08);
            transform: translateY(100%);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        .order-bar.show { transform: translateY(0); }

        .btn-send {
            background: var(--success);
            color: white;
            width: 100%;
            height: 55px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 800;
            font-size: 17px;
            gap: 10px;
            margin-top: 15px;
        }

        /* Admin */
        .admin-view {
            position: fixed; inset: 0; background: #f9fafb; z-index: 2000;
            padding: 30px; display: none; overflow-y: auto;
        }
        .input-admin { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div id="hero" class="hero">
        <div>
            <h1>PETPOINT</h1>
            <p id="promo-display">Envíos gratis: Mié, Vie y Sáb</p>
        </div>
        <button onclick="document.getElementById('admin-modal').style.display='block'" style="position:absolute; top:20px; right:20px; background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:40px; height:40px; color:white;">⚙️</button>
    </div>

    <div class="search-area">
        <input type="text" id="finder" class="search-input" placeholder="Buscar alimento o accesorio..." onkeyup="filter()">
    </div>

    <div class="filters">
        <div class="chip active" onclick="setCat('Todos', this)">Todos</div>
        <div class="chip" onclick="setCat('Perros', this)">Perros 🐶</div>
        <div class="chip" onclick="setCat('Gatos', this)">Gatos 🐱</div>
    </div>

    <div id="main-grid" class="grid"></div>

    <div id="order-bar" class="order-bar">
        <div style="display:flex; justify-content:space-between; align-items:flex-end">
            <div>
                <span id="p-brand" style="font-size:12px; font-weight:800; color:var(--accent)">MARCA</span>
                <div id="p-title" style="font-size:18px; font-weight:800">Nombre Producto</div>
            </div>
            <div id="p-cost" style="font-size:22px; font-weight:800">$ 0.00</div>
        </div>
        <a href="#" id="wa-btn" class="btn-send" target="_blank">Pedir por WhatsApp</a>
    </div>

    <div id="admin-modal" class="admin-view">
        <h2>Panel de Control</h2>
        <div id="login-zone">
            <input type="password" id="pass" class="input-admin" placeholder="Contraseña (0007)">
            <button onclick="login()" class="btn-send" style="background:var(--primary)">Ingresar</button>
            <button onclick="document.getElementById('admin-modal').style.display='none'" style="width:100%; border:none; background:none; margin-top:15px">Cancelar</button>
        </div>
        <div id="config-zone" style="display:none">
            <label>WhatsApp (con código de país):</label>
            <input type="text" id="cfg-wa" class="input-admin">
            <label>Texto de Promoción:</label>
            <input type="text" id="cfg-promo" class="input-admin">
            <button onclick="saveAdmin()" class="btn-send">Guardar cambios</button>
        </div>
    </div>

    <script>
        // Datos iniciales
        let db = {
            wa: "5492262655225",
            promo: "Miércoles, viernes y sábado envío gratis",
            items: [
                { id: 1, cat: "Perros", b: "Old Prince", n: "Equilibrium Adulto", p: 64700, img: "https://images.unsplash.com/photo-1589924691995-ad0029ecbb68?w=400" },
                { id: 2, cat: "Perros", b: "Kongo", n: "Natural Adulto", p: 30200, img: "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=400" },
                { id: 3, cat: "Gatos", b: "Royal Canin", n: "Kitten Gato", p: 37500, img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400" },
                { id: 4, cat: "Perros", b: "Royal Canin", n: "Medium Adult", p: 155200, img: "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=400" }
            ]
        };

        let currentCat = "Todos";

        function renderItems() {
            const container = document.getElementById('main-grid');
            const search = document.getElementById('finder').value.toLowerCase();
            
            const html = db.items
                .filter(i => (currentCat === "Todos" || i.cat === currentCat) && 
                             (i.b.toLowerCase().includes(search) || i.n.toLowerCase().includes(search)))
                .map(i => `
                    <div class="card" onclick="openOrder(${i.id})">
                        <img src="${i.img}">
                        <div class="card-info">
                            <div class="card-brand">${i.b}</div>
                            <div class="card-name">${i.n}</div>
                            <div class="card-price">$${i.p.toLocaleString('es-AR')}</div>
                        </div>
                    </div>
                `).join('');
            
            container.innerHTML = html || '<p style="text-align:center">No hay resultados</p>';
        }

        function openOrder(id) {
            const item = db.items.find(x => x.id === id);
            document.getElementById('p-brand').innerText = item.b;
            document.getElementById('p-title').innerText = item.n;
            document.getElementById('p-cost').innerText = "$" + item.p.toLocaleString('es-AR');
            
            const text = `Hola PetPoint! 👋\nQuiero encargar:\n✅ ${item.b} - ${item.n}\n💰 Total: $${item.p.toLocaleString('es-AR')}`;
            document.getElementById('wa-btn').href = `https://wa.me/${db.wa}?text=${encodeURIComponent(text)}`;
            
            document.getElementById('order-bar').classList.add('show');
        }

        function setCat(cat, el) {
            currentCat = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        function filter() { renderItems(); }

        // Funciones Admin
        function login() {
            if(document.getElementById('pass').value === '0007') {
                document.getElementById('login-zone').style.display = 'none';
                document.getElementById('config-zone').style.display = 'block';
                document.getElementById('cfg-wa').value = db.wa;
                document.getElementById('cfg-promo').value = db.promo;
            } else { alert("Clave incorrecta"); }
        }

        function saveAdmin() {
            db.wa = document.getElementById('cfg-wa').value;
            db.promo = document.getElementById('cfg-promo').value;
            document.getElementById('promo-display').innerText = db.promo;
            localStorage.setItem('petpoint_db', JSON.stringify(db));
            alert("¡Guardado!");
            document.getElementById('admin-modal').style.display = 'none';
        }

        // Cargar datos guardados si existen
        const saved = localStorage.getItem('petpoint_db');
        if(saved) {
            db = JSON.parse(saved);
            document.getElementById('promo-display').innerText = db.promo;
        }

        renderItems();
    </script>
</body>
</html>
